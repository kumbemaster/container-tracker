{% extends "tracking/base.html" %}

{% block title %}Answer your security question{% endblock %}

{% block content %}
<main class="wrap agent-wrap agent-narrow">
<div class="card">
<h1>Answer your security question</h1>
<p class="help">{{ question }}</p>
{% if error %}
<p class="banner error" role="status"><span class="banner-text">{{ error }}</span> <button type="button" class="banner-x" data-dismiss aria-label="Dismiss">&times;</button></p>
{% endif %}
<form method="post" action="{% url 'agent_forgot_answer' %}">
{% csrf_token %}
<label for="id_answer">Answer</label>
<input id="id_answer" type="text" name="answer" autocomplete="off" required>
<label for="id_new_password">New password</label>
<input id="id_new_password" type="password" name="new_password" autocomplete="new-password" required>
<label for="id_confirm">Confirm new password</label>
<input id="id_confirm" type="password" name="confirm" autocomplete="new-password" required>
<button type="submit">Change password</button>
</form>
<p><a href="{% url 'agent_login' %}">Back to log in</a></p>
</div>
</main>
{% endblock %}
