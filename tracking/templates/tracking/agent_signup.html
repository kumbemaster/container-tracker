{% extends "tracking/base.html" %}

{% block title %}Create an agent account{% endblock %}

{% block content %}
<main class="wrap agent-wrap agent-narrow">
<div class="card">
<p><a class="btn btn-secondary" href="{% url 'search' %}">← Back to tracking</a></p>
<h1>Create an account</h1>
{% if error %}
<p class="banner error" role="status"><span class="banner-text">{{ error }}</span> <button type="button" class="banner-x" data-dismiss aria-label="Dismiss">&times;</button></p>
{% endif %}
<form method="post" action="{% url 'agent_signup' %}">
{% csrf_token %}
<label for="id_company">Company name</label>
<input id="id_company" type="text" name="company" value="{{ values.company }}" autocomplete="organization" required>
<label for="id_username">Username</label>
<input id="id_username" type="text" name="username" value="{{ values.username }}" autocomplete="username" required>
<label for="id_password">Password</label>
<input id="id_password" type="password" name="password" autocomplete="new-password" required>
<label for="id_confirm">Confirm password</label>
<input id="id_confirm" type="password" name="confirm" autocomplete="new-password" required>
<button type="submit">Create account</button>
</form>
<p><a href="{% url 'agent_login' %}">Already have an account? Log in</a></p>
</div>
</main>
{% endblock %}
