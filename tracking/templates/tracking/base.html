<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}Track a shipment{% endblock %} · Port-2-Door</title>
{% load static %}
<link rel="stylesheet" href="{% static 'tracking/style.css' %}?v={{ css_version }}">
</head>
<body>
<header class="sitebar">
<a class="wordmark" href="{% url 'search' %}" aria-label="Port-2-Door home">Port-<span class="wordmark-two">2</span>-Door</a>
{% block topsearch %}{% endblock %}
{% block langswitch %}{% endblock %}
<nav class="sitenav">{% block nav %}{% endblock %}</nav>
</header>
{% block content %}{% endblock %}
<script>
// Manual dismiss for every message banner. Automatic dismissal lives
// only on [data-transient] banners and never on access-code messages.
(function () {
  document.addEventListener('click', function (event) {
    var button = event.target.closest('[data-dismiss]');
    if (!button) return;
    var banner = button.closest('.banner');
    if (banner) banner.remove();
  });
})();
</script>
</body>
</html>
