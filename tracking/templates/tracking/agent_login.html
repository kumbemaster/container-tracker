{% extends "tracking/base.html" %}

{% block title %}Agent login{% endblock %}

{% block content %}
<main class="wrap agent-wrap agent-narrow">
<div class="card">
<h1>Agent login</h1>
{% if form.non_field_errors %}
<p class="error">{{ form.non_field_errors }}</p>
{% endif %}
<form method="post" action="{% url 'agent_login' %}">
{% csrf_token %}
<label for="id_username">Username</label>
<input id="id_username" type="text" name="username" autocomplete="username" required>
<label for="id_password">Password</label>
<input id="id_password" type="password" name="password" autocomplete="current-password" required>
<button type="submit">Log in</button>
</form>
{% if allow_signup %}
<p><a href="{% url 'agent_signup' %}">Create an account</a></p>
{% endif %}
</div>
</main>
{% endblock %}
